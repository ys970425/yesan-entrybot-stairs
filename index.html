<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>예산과 함께하는 엔트리봇 무한의 계단</title>
  <meta name="description" content="예산 엔트리 쉼터 부스용 엔트리봇 무한의 계단 게임 — 제작: myoLab(산쌤)">
  <meta name="theme-color" content="#2b8fd6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="엔트리봇 계단">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preload" href="fonts/Galmuri11-Bold.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face { font-family: 'Galmuri11'; src: url('fonts/Galmuri11-Bold.woff2') format('woff2'); font-weight: 700; font-display: block; }
    @font-face { font-family: 'Galmuri11'; src: url('fonts/Galmuri11.woff2') format('woff2'); font-weight: 400; font-display: block; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #1b2246;
      overscroll-behavior: none;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas#game {
      position: fixed; left: 0; top: 0;
      display: block;
      touch-action: none;
      image-rendering: pixelated;
    }
    #nickbox {
      position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
      background: rgba(10,16,40,0.72); z-index: 10; font-family: 'Galmuri11', sans-serif;
      -webkit-user-select: text; user-select: text;
    }
    #nickbox .panel {
      width: min(90vw, 560px); background: #fff8e6; border: 6px solid #1b2246; border-radius: 22px;
      padding: 28px 26px 24px; box-sizing: border-box; text-align: center; color: #1b2246;
    }
    #nickbox h2 { margin: 0 0 6px; font-size: 34px; font-weight: 700; }
    #nickbox p.sub { margin: 0 0 18px; font-size: 18px; color: #3b5bab; }
    #nickbox input {
      width: 100%; box-sizing: border-box; font: 700 36px 'Galmuri11', sans-serif; text-align: center;
      padding: 14px 10px; border: 5px solid #1b2246; border-radius: 14px; background: #fff; color: #1b2246;
      outline: none;
    }
    #nickbox input:focus { border-color: #ff8a1e; }
    #nickbox .err { min-height: 26px; margin: 10px 0 6px; font-size: 20px; color: #e8402e; }
    #nickbox .row { display: flex; gap: 14px; }
    #nickbox button {
      flex: 1; font: 700 30px 'Galmuri11', sans-serif; padding: 16px 0; border: 5px solid #1b2246;
      border-radius: 16px; background: #ffcc33; color: #1b2246; cursor: pointer;
    }
    #nickbox button.ghost { background: #e6e9f0; flex: 0.6; }
    #nickbox .note { margin-top: 14px; font-size: 15px; color: #6b7290; }
    #nickbox .pick { display: flex; align-items: center; gap: 14px; margin: 14px 0 4px; }
    #nickbox canvas#nickbot { width: 96px; height: 96px; flex: none; image-rendering: auto; }
    #nickbox .sw { display: grid; grid-template-columns: repeat(6, 1fr); column-gap: 8px; row-gap: 26px; flex: 1; }
    #nickbox .sw button { flex: none; padding: 0; height: 40px; border-radius: 12px; border: 4px solid #1b2246;
      font: 700 12px 'Galmuri11', sans-serif; color: transparent; position: relative; }
    #nickbox .sw button.on { outline: 4px solid #ff8a1e; outline-offset: 2px; }
    #nickbox .sw button span { position: absolute; left: -4px; right: -4px; bottom: -19px; color: #1b2246; font-size: 12px; font-weight: 400; }
    #nickbox .sw { padding-bottom: 16px; }
    #nickbox .lab { text-align: left; font-size: 18px; margin: 12px 0 0; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="nickbox">
    <form class="panel" id="nickform" autocomplete="off">
      <h2>닉네임을 입력하세요</h2>
      <p class="sub">TV 순위표에 이 이름으로 올라가요 (8글자까지)</p>
      <input id="nickinput" type="text" maxlength="8" enterkeyhint="go" spellcheck="false" placeholder="예: 계단왕">
      <div class="err" id="nickerr"></div>
      <div class="lab">내 엔트리봇 색 고르기</div>
      <div class="pick">
        <canvas id="nickbot" width="192" height="192"></canvas>
        <div class="sw" id="swatches"></div>
      </div>
      <div class="row">
        <button type="button" class="ghost" id="nickcancel">취소</button>
        <button type="submit" id="nickok">시작!</button>
      </div>
      <div class="note">진짜 이름 말고 닉네임을 써 주세요</div>
    </form>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
